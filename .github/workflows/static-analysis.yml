name: Static Analysis

on:
  pull_request:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: Static-Analysis-${{ github.ref }}
  cancel-in-progress: true

jobs:
  releaseconfiguration:
    name: Release Configuration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Test privacy manifest validation
        run: python3 -m unittest discover -s Scripts/tests -p 'test_*.py' -v
      - name: Validate release configuration
        run: Scripts/validate_release_configuration.sh
  reuse_action:
    name: REUSE Compliance Check
    uses: StanfordBDHG/.github/.github/workflows/reuse.yml@v2
    permissions:
      contents: read
  swiftlint:
    name: SwiftLint
    uses: StanfordBDHG/.github/.github/workflows/swiftlint.yml@v2
    permissions:
      contents: read
  periphery:
    name: Periphery
    uses: StanfordSpezi/.github/.github/workflows/periphery.yml@v2
    permissions:
      contents: read
    with:
      runsonlabels: '["macOS", "self-hosted"]'
  markdownlinkcheck:
    name: Markdown Link Check
    uses: StanfordBDHG/.github/.github/workflows/markdown-link-check.yml@v2
    permissions:
      contents: read
  codeql:
    name: CodeQL
    uses: StanfordBDHG/.github/.github/workflows/xcodebuild-or-fastlane.yml@v2
    permissions:
      security-events: write
      actions: read
      contents: read
    with:
      codeql: true
      fastlanelane: codeql
